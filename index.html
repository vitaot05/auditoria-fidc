<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria de Fundos</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

<style>

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f0f2f5;
    color: #111827;
    min-height: 100vh;
}

/* ── HEADER ─────────────────────────────────────────────── */

header {
    background: #1f2937;
    color: white;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.headerTitulo h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.2px;
}

.headerTitulo p {
    font-size: 12px;
    opacity: .55;
    margin-top: 4px;
}

.headerBtns {
    display: flex;
    gap: 6px;
}

.btnHeader {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,.25);
    background: transparent;
    color: rgba(255,255,255,.75);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
}

.btnHeader:hover { background: rgba(255,255,255,.1); }

.btnHeader.ativo {
    background: white;
    color: #1f2937;
    border-color: white;
    font-weight: 600;
}

/* ── LAYOUT ─────────────────────────────────────────────── */

main {
    padding: 28px 40px;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* ── KPI GRID ────────────────────────────────────────────── */

.kpiGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.kpiCard {
    background: #e5e8ed;
    border-radius: 10px;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.kpiLabel {
    font-size: 12px;
    color: #6b7280;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.kpiNum {
    font-size: 30px;
    font-weight: 700;
    color: #111827;
    line-height: 1;
}

.kpiNum.vermelho { color: #A32D2D; }

/* ── FUND CARDS ──────────────────────────────────────────── */

.cardGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 14px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    transition: transform .15s, box-shadow .15s;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,.11);
}

.card.ativo {
    outline: 2.5px solid #2563eb;
    outline-offset: 2px;
}

.cardTopo { height: 5px; }

.cardCorpo { padding: 18px 20px; }

.cardHeader {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
}

.cardNome {
    font-size: 17px;
    font-weight: 700;
}

.cardDots {
    display: flex;
    gap: 4px;
    align-items: center;
    padding-top: 3px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.dot.ok    { background: #639922; }
.dot.aviso { background: #BA7517; }
.dot.erro  { background: #A32D2D; }
.dot.vazio { background: #d1d5db; }

.cardTaxa {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1;
}

.progressoWrap {
    background: #e5e7eb;
    border-radius: 999px;
    height: 6px;
    margin-bottom: 12px;
    overflow: hidden;
}

.progressoBarra {
    height: 100%;
    border-radius: 999px;
}

.cardMeta {
    font-size: 11.5px;
    color: #9ca3af;
    line-height: 1.6;
}

/* ── PAINEL BRANCO ───────────────────────────────────────── */

.painelBranco {
    background: white;
    border-radius: 10px;
    padding: 22px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

/* ── CHART ───────────────────────────────────────────────── */

.chartHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
}

.chartTitulo {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    letter-spacing: -.1px;
}

.filtrosDatas {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

.filtrosDatas label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #6b7280;
}

.filtrosDatas input[type="date"] {
    border: 1.5px solid #d1d5db;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    color: #374151;
    background: white;
    cursor: pointer;
    outline: none;
    transition: border-color .12s;
}

.filtrosDatas input[type="date"]:focus {
    border-color: #2563eb;
}

.chartWrap {
    height: 250px;
    position: relative;
}

/* ── HISTÓRICO ───────────────────────────────────────────── */

.secaoTitulo {
    font-size: 14px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 14px;
    letter-spacing: -.1px;
}

.filtrosTabela {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
}

.btnGroup {
    display: flex;
    border: 1.5px solid #d1d5db;
    border-radius: 6px;
    overflow: hidden;
}

.btnTab {
    padding: 5px 13px;
    border: none;
    border-right: 1.5px solid #d1d5db;
    background: white;
    font-size: 12.5px;
    cursor: pointer;
    color: #374151;
    transition: background .12s;
}

.btnTab:last-child { border-right: none; }
.btnTab:hover:not(.ativo) { background: #f9fafb; }

.btnTab.ativo {
    background: #1f2937;
    color: white;
    font-weight: 600;
}

/* ── TABLE ───────────────────────────────────────────────── */

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

thead th {
    background: #f9fafb;
    color: #9ca3af;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 9px 14px;
    text-align: left;
    border-bottom: 1.5px solid #e5e7eb;
    white-space: nowrap;
}

tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid #f3f4f6;
    color: #374151;
    vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafafa; }

.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.badge.ok    { background: #eef4e4; color: #639922; }
.badge.aviso { background: #fef4e4; color: #BA7517; }
.badge.erro  { background: #f5e8e8; color: #A32D2D; }

.motivoCell {
    color: #9ca3af;
    font-size: 12px;
    max-width: 300px;
}

.semDados {
    text-align: center;
    color: #9ca3af;
    padding: 36px;
    font-size: 13px;
}

/* ── RESPONSIVE ──────────────────────────────────────────── */

@media (max-width: 960px) {
    header { padding: 16px 20px; }
    main   { padding: 18px 20px; }
    .kpiGrid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 560px) {
    .kpiGrid { grid-template-columns: 1fr 1fr; }
    .headerTitulo h1 { font-size: 17px; }
    .btnHeader { padding: 5px 12px; font-size: 12px; }
    .chartHeader { flex-direction: column; align-items: flex-start; }
}

</style>
</head>
<body>

<header>
    <div class="headerTitulo">
        <h1>Auditoria de Fundos</h1>
        <p id="ultimaAtualizacao">Carregando…</p>
    </div>
    <div class="headerBtns">
        <button class="btnHeader ativo" id="btnTodos">Todos</button>
        <button class="btnHeader" id="btnAlertas">Alertas</button>
    </div>
</header>

<main>

    <!-- KPIs -->
    <div class="kpiGrid">
        <div class="kpiCard">
            <span class="kpiLabel">Fundos Monitorados</span>
            <span class="kpiNum" id="kpiFundos">—</span>
        </div>
        <div class="kpiCard">
            <span class="kpiLabel">Taxa Global</span>
            <span class="kpiNum" id="kpiTaxa">—</span>
        </div>
        <div class="kpiCard">
            <span class="kpiLabel">Total Auditorias</span>
            <span class="kpiNum" id="kpiTotal">—</span>
        </div>
        <div class="kpiCard">
            <span class="kpiLabel">Total Falhas</span>
            <span class="kpiNum vermelho" id="kpiFalhas">—</span>
        </div>
    </div>

    <!-- Fund Cards -->
    <div class="cardGrid" id="cards"></div>

    <!-- Chart + Date filter -->
    <div class="painelBranco">
        <div class="chartHeader">
            <span class="chartTitulo">Taxa de Sucesso</span>
            <div class="filtrosDatas">
                <label>
                    De
                    <input type="date" id="inputDataInicio">
                </label>
                <label>
                    Até
                    <input type="date" id="inputDataFim">
                </label>
            </div>
        </div>
        <div class="chartWrap">
            <canvas id="grafico"></canvas>
        </div>
    </div>

    <!-- History (hidden until fund is selected) -->
    <div class="painelBranco" id="secaoHistorico" style="display:none">
        <div class="secaoTitulo" id="tituloHistorico">Histórico</div>
        <div class="filtrosTabela">
            <div class="btnGroup" id="grupoStatus">
                <button class="btnTab ativo" data-val="">Todos</button>
                <button class="btnTab" data-val="OK">OK</button>
                <button class="btnTab" data-val="AVISO">Aviso</button>
                <button class="btnTab" data-val="ERRO">Erro</button>
            </div>
        </div>
        <div id="tabelaWrap"></div>
    </div>

</main>

<script>

// ── Constantes ───────────────────────────────────────────────

const COR_VERDE    = '#639922';
const COR_AMARELO  = '#BA7517';
const COR_VERMELHO = '#A32D2D';

const CHART_CORES = [
    '#2563eb', '#7c3aed', '#d97706',
    '#059669', '#db2777', '#0891b2'
];

// ── Estado ───────────────────────────────────────────────────

let historicoGlobal  = [];
let dadosGlobal      = null;
let fundoAtivo       = null;
let modoCards        = 'todos';   // 'todos' | 'alertas'
let filtroStatus     = '';        // '' | 'OK' | 'AVISO' | 'ERRO'
let graficoInstancia = null;

// ── Helpers ──────────────────────────────────────────────────

function parseDateBR(str) {
    if (!str || !str.includes('/')) return new Date(0);
    const [d, m, y] = str.split('/');
    return new Date(+y, +m - 1, +d);
}

// "DD/MM/YYYY" → "YYYY-MM-DD" (formato dos inputs type="date")
function brToISO(str) {
    const [d, m, y] = str.split('/');
    return `${y}-${m}-${d}`;
}

function uniqueDatesSorted(registros) {
    const set = new Set(registros.map(r => r.data_auditada).filter(Boolean));
    return [...set].sort((a, b) => parseDateBR(a) - parseDateBR(b));
}

// Últimas N data_auditada distintas de um fundo (para dots e contagem de alertas)
function lastDates(fundo, n) {
    const regs  = historicoGlobal.filter(r => r.fundo === fundo);
    const dates = uniqueDatesSorted(regs);
    return n ? dates.slice(-n) : dates;
}

// Conta ERROs nas últimas N datas — determina a cor do card
function errosRecentes(fundo, n) {
    const dateSet = new Set(lastDates(fundo, n));
    return historicoGlobal.filter(
        r => r.fundo === fundo && r.status === 'ERRO' && dateSet.has(r.data_auditada)
    ).length;
}

// Conta ERRO + AVISO nas últimas N datas — determina se aparece em "Alertas"
function problemasRecentes(fundo, n) {
    const dateSet = new Set(lastDates(fundo, n));
    return historicoGlobal.filter(
        r => r.fundo === fundo && r.status !== 'OK' && dateSet.has(r.data_auditada)
    ).length;
}

function corDeFundo(fundo) {
    const e = errosRecentes(fundo, 5);
    if (e === 0)  return COR_VERDE;
    if (e <= 3)   return COR_AMARELO;
    return COR_VERMELHO;
}

// Array de {status, data} para os últimos 5 dias — pontinhos do card
// AVISO é exibido em amarelo, ERRO em vermelho, OK em verde
function dotsDeFundo(fundo) {
    const dates = lastDates(fundo, 5);
    const dots  = dates.map(d => {
        const regsNoDia = historicoGlobal.filter(
            r => r.fundo === fundo && r.data_auditada === d
        );
        const temErro  = regsNoDia.some(r => r.status === 'ERRO');
        const temAviso = regsNoDia.some(r => r.status === 'AVISO');
        return {
            data:   d,
            status: temErro ? 'erro' : temAviso ? 'aviso' : 'ok'
        };
    });
    while (dots.length < 5) dots.unshift({ data: '', status: 'vazio' });
    return dots;
}

// Taxa de sucesso de um fundo em uma data (ou null se sem dados)
function taxaNoDia(fundo, data) {
    const regs = historicoGlobal.filter(
        r => r.fundo === fundo && r.data_auditada === data
    );
    if (!regs.length) return null;
    return Math.round(regs.filter(r => r.status === 'OK').length / regs.length * 100);
}

// Retorna o intervalo de datas selecionado nos inputs como strings ISO "YYYY-MM-DD"
function getDateRange() {
    return {
        inicio: document.getElementById('inputDataInicio').value || null,
        fim:    document.getElementById('inputDataFim').value    || null,
    };
}

// Verifica se uma data_auditada "DD/MM/YYYY" está dentro do intervalo selecionado
function inDateRange(dataAuditada) {
    if (!dataAuditada) return false;
    const { inicio, fim } = getDateRange();
    const iso = brToISO(dataAuditada);
    if (inicio && iso < inicio) return false;
    if (fim    && iso > fim)   return false;
    return true;
}

// ── Render KPIs ──────────────────────────────────────────────

function renderKPIs() {
    const k = dadosGlobal.kpis;
    document.getElementById('kpiFundos').innerText = k.fundos_monitorados;
    document.getElementById('kpiTaxa').innerText   = k.taxa_global + '%';
    document.getElementById('kpiTotal').innerText  = k.total_registros;
    document.getElementById('kpiFalhas').innerText = k.total_falhas;
    document.getElementById('ultimaAtualizacao').innerText =
        'Última atualização: ' + dadosGlobal.ultima_atualizacao;
}

// ── Render Cards ─────────────────────────────────────────────

function renderCards() {
    const container = document.getElementById('cards');
    container.innerHTML = '';

    let fundos = dadosGlobal.fundos;
    if (modoCards === 'alertas') {
        fundos = fundos.filter(f => problemasRecentes(f.nome, 5) > 0);
    }

    if (!fundos.length) {
        container.innerHTML =
            '<p style="color:#9ca3af;font-size:13px">Nenhum fundo com alertas nos últimos 5 dias.</p>';
        return;
    }

    fundos.forEach(f => {
        const cor  = corDeFundo(f.nome);
        const dots = dotsDeFundo(f.nome);

        const dotsHtml = dots.map(({ status, data }) =>
            `<span class="dot ${status}" title="${data}"></span>`
        ).join('');

        // Falhas em vermelho, avisos em amarelo (só exibe se > 0)
        const falhasHtml = f.falhas > 0
            ? `<span style="color:${COR_VERMELHO};font-weight:600">${f.falhas} falha${f.falhas !== 1 ? 's' : ''}</span>`
            : `0 falhas`;
        const avisosHtml = f.avisos > 0
            ? ` · <span style="color:${COR_AMARELO};font-weight:600">${f.avisos} aviso${f.avisos !== 1 ? 's' : ''}</span>`
            : '';

        const card = document.createElement('div');
        card.className = 'card' + (fundoAtivo === f.nome ? ' ativo' : '');

        card.innerHTML = `
            <div class="cardTopo" style="background:${cor}"></div>
            <div class="cardCorpo">
                <div class="cardHeader">
                    <span class="cardNome">${f.nome}</span>
                    <div class="cardDots">${dotsHtml}</div>
                </div>
                <div class="cardTaxa" style="color:${cor}">${f.taxa_sucesso}%</div>
                <div class="progressoWrap">
                    <div class="progressoBarra"
                         style="width:${f.taxa_sucesso}%;background:${cor}"></div>
                </div>
                <div class="cardMeta">
                    ${falhasHtml}${avisosHtml}
                    &nbsp;·&nbsp; ${f.total} auditorias
                    &nbsp;·&nbsp; ${f.dias_auditados} dias
                </div>
            </div>`;

        // Melhoria 3: clicar no fundo ativo desmarca; clicar em outro seleciona
        card.onclick = () => {
            if (fundoAtivo === f.nome) {
                fundoAtivo = null;
                renderCards();
                renderHistorico();
            } else {
                fundoAtivo = f.nome;
                renderCards();
                renderHistorico();
                document.getElementById('secaoHistorico')
                    .scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        container.appendChild(card);
    });
}

// ── Render Gráfico ───────────────────────────────────────────

function renderGrafico() {
    const { inicio, fim } = getDateRange();

    // Filtra as datas do historico pelo intervalo selecionado
    let todasDatas = uniqueDatesSorted(historicoGlobal);
    if (inicio || fim) {
        todasDatas = todasDatas.filter(d => {
            const iso = brToISO(d);
            if (inicio && iso < inicio) return false;
            if (fim    && iso > fim)   return false;
            return true;
        });
    }

    const labels = todasDatas.map(d => d.slice(0, 5));   // "DD/MM"
    const fundos = dadosGlobal.fundos.map(f => f.nome);

    const datasets = fundos.map((nome, i) => ({
        label:            nome,
        data:             todasDatas.map(d => taxaNoDia(nome, d)),
        borderColor:      CHART_CORES[i % CHART_CORES.length],
        backgroundColor:  'transparent',
        borderWidth:      2.5,    // Melhoria 2: espessura aumentada
        pointRadius:      3,
        pointHoverRadius: 5,
        tension:          0.35,
        spanGaps:         true,
    }));

    if (graficoInstancia) graficoInstancia.destroy();

    const ctx = document.getElementById('grafico').getContext('2d');
    graficoInstancia = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { boxWidth: 10, padding: 16, font: { size: 12 } }
                },
                tooltip: {
                    callbacks: {
                        label: ctx => {
                            const v = ctx.parsed.y;
                            return ` ${ctx.dataset.label}: ${v !== null ? v + '%' : '—'}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid:  { color: '#f3f4f6' },
                    ticks: {
                        font:          { size: 11 },
                        color:         '#9ca3af',
                        maxTicksLimit: 12,
                        autoSkip:      true,
                    }
                },
                y: {
                    min:          0,
                    suggestedMax: 105,   // Melhoria 2: evita linha em 100% colada na borda
                    grid: { color: '#f3f4f6' },
                    ticks: {
                        font:     { size: 11 },
                        color:    '#9ca3af',
                        callback: v => v <= 100 ? v + '%' : ''
                    }
                }
            }
        }
    });
}

// ── Render Histórico ─────────────────────────────────────────

function renderHistorico() {
    const secao = document.getElementById('secaoHistorico');
    if (!fundoAtivo) { secao.style.display = 'none'; return; }

    secao.style.display = '';
    document.getElementById('tituloHistorico').innerText =
        'Histórico — ' + fundoAtivo;

    let regs = historicoGlobal.filter(r => r.fundo === fundoAtivo);

    // Filtro de período: intervalo de datas selecionado
    regs = regs.filter(r => inDateRange(r.data_auditada));

    // Filtro de status
    if (filtroStatus) {
        regs = regs.filter(r => r.status === filtroStatus);
    }

    // Melhoria 5: ordena por data_auditada decrescente (mais recente primeiro)
    regs.sort((a, b) => parseDateBR(b.data_auditada) - parseDateBR(a.data_auditada));

    const wrap = document.getElementById('tabelaWrap');

    if (!regs.length) {
        wrap.innerHTML =
            '<div class="semDados">Nenhum registro para os filtros selecionados.</div>';
        return;
    }

    // Melhoria 1: badge para AVISO
    const badgeMap = {
        'OK':    '<span class="badge ok">✓ OK</span>',
        'AVISO': '<span class="badge aviso">⚠ Aviso</span>',
        'ERRO':  '<span class="badge erro">✕ Erro</span>',
    };

    const linhas = regs.map(r => {
        const badge = badgeMap[r.status] || `<span class="badge">${r.status}</span>`;
        return `
        <tr>
            <td>${r.data_auditada || '—'}</td>
            <td style="color:#9ca3af">${r.data_execucao || '—'}</td>
            <td>${r.arquivo}</td>
            <td>${badge}</td>
            <td class="motivoCell">${r.motivo || ''}</td>
        </tr>`;
    }).join('');

    wrap.innerHTML = `
    <table>
        <thead>
            <tr>
                <th>Data Auditada</th>
                <th>Data Execução</th>
                <th>Arquivo</th>
                <th>Status</th>
                <th>Motivo</th>
            </tr>
        </thead>
        <tbody>${linhas}</tbody>
    </table>`;
}

// ── Controles ────────────────────────────────────────────────

function ativarBtn(grupo, btnClicado) {
    grupo.querySelectorAll('.btnTab').forEach(b => b.classList.remove('ativo'));
    btnClicado.classList.add('ativo');
}

// Header: Todos / Alertas
document.getElementById('btnTodos').onclick = () => {
    modoCards = 'todos';
    document.getElementById('btnTodos').classList.add('ativo');
    document.getElementById('btnAlertas').classList.remove('ativo');
    renderCards();
};

document.getElementById('btnAlertas').onclick = () => {
    modoCards = 'alertas';
    document.getElementById('btnAlertas').classList.add('ativo');
    document.getElementById('btnTodos').classList.remove('ativo');
    renderCards();
};

// Filtro de status da tabela (inclui AVISO)
document.getElementById('grupoStatus').querySelectorAll('.btnTab').forEach(btn => {
    btn.onclick = () => {
        filtroStatus = btn.dataset.val;
        ativarBtn(document.getElementById('grupoStatus'), btn);
        renderHistorico();
    };
});

// Inputs de data: re-renderiza gráfico e tabela ao mudar
document.getElementById('inputDataInicio').oninput = () => {
    renderGrafico();
    renderHistorico();
};
document.getElementById('inputDataFim').oninput = () => {
    renderGrafico();
    renderHistorico();
};

// ── Inicialização ────────────────────────────────────────────

async function carregar() {
    try {
        const [dados, historico] = await Promise.all([
            fetch('dados.json').then(r => r.json()),
            fetch('historico.json').then(r => r.json()),
        ]);

        dadosGlobal     = dados;
        historicoGlobal = historico;

        // Melhoria 4: inicializa os inputs de data
        const todasDatas = uniqueDatesSorted(historicoGlobal);
        if (todasDatas.length) {
            const minISO = brToISO(todasDatas[0]);
            const maxISO = brToISO(todasDatas[todasDatas.length - 1]);

            const inputInicio = document.getElementById('inputDataInicio');
            const inputFim    = document.getElementById('inputDataFim');

            inputInicio.min = minISO;
            inputInicio.max = maxISO;
            inputFim.min    = minISO;
            inputFim.max    = maxISO;
            inputFim.value  = maxISO;

            // Padrão: últimos 30 dias a partir do máximo
            const maxDate   = new Date(maxISO + 'T00:00:00');
            const start30   = new Date(maxDate);
            start30.setDate(start30.getDate() - 29);
            const minDate   = new Date(minISO + 'T00:00:00');
            const startFinal = start30 < minDate ? minDate : start30;
            inputInicio.value = startFinal.toISOString().slice(0, 10);
        }

        renderKPIs();
        renderCards();
        renderGrafico();

    } catch (e) {
        document.getElementById('ultimaAtualizacao').innerText =
            'Erro ao carregar dados: ' + e.message;
    }
}

carregar();

</script>
